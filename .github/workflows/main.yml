name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the source code (and the themes, i.e. submodules)
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
#          fetch-depth: 0
      # Download the Hugo (extended) binary
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true
      # Build the static website
      - name: Build
        run: make install-blowfish-deps compile-tailwind build
      # Archive the build to retrieve it later if necessary
      - name: Store artifact
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: ./public
      # Deploy to the gh-pages branch on the same remote
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
