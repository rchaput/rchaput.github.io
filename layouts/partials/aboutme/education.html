<section class="py-12">
  <h2 class="text-3xl font-bold mb-8 text-center">Education</h2>

  <div class="max-w-4xl mx-auto pt-8">
    <ul class="space-y-6">
      {{ range .Params.education }}
        <li class="flex flex-col md:flex-row md:justify-between items-start">
          <div>
            <h3 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-2 font-serif">
              {{ partial "icon" "fas/graduation-cap" }}
              {{ .degree | markdownify | emojify }}
            </h3>
            <p class="text-lg text-gray-600 dark:text-gray-400">
              {{ .institution | markdownify | emojify }}
            </p>
            {{ with .description }}
              <p class="mt-1 text-base text-gray-500 dark:text-gray-500">
                {{ . | markdownify | emojify }}
              </p>
            {{ end }}
          </div>
          <div class="mt-2 md:mt-0 font-medium text-gray-500 dark:text-gray-400">
            {{ .year }}
          </div>
        </li>
      {{ end }}
    </ul>
  </div>
</section>
